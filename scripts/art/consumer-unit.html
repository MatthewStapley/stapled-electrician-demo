<!doctype html>
<!-- Front elevation of a generic UK metal consumer unit, 1400 x 1400 CSS px.
     Rasterised by scripts/art/rasterise.mjs. No manufacturer's branding. -->
<meta charset="utf-8">
<style>
@font-face{font-family:Ar;src:url(../../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2);font-weight:100 900;font-stretch:62% 125%}
*{box-sizing:border-box;margin:0}
html,body{width:1400px;height:1400px;overflow:hidden}
body{font-family:Ar,sans-serif;background:radial-gradient(90% 70% at 42% 34%,#46515f 0,#2d3745 46%,#1a2230 100%);position:relative}
.wall{position:absolute;inset:0;opacity:.5;background-image:radial-gradient(#ffffff0a 1px,transparent 1.4px),radial-gradient(#0000001f 1px,transparent 1.4px);background-size:7px 7px,11px 11px;background-position:0 0,3px 4px}
.cu{position:absolute;left:150px;top:300px;width:1100px;height:640px;border-radius:10px;background:linear-gradient(180deg,#f4f4f1,#dfe0dc 62%,#cfd0cb);box-shadow:0 2px 0 #fff inset,0 -3px 0 #0002 inset,0 36px 60px -18px #0009,0 90px 120px -50px #000a}
.lip{position:absolute;inset:20px;border-radius:5px;background:linear-gradient(180deg,#e7e8e4,#f1f1ee);box-shadow:inset 0 2px 5px #0003,inset 0 0 0 1px #0000000f}
.screw{position:absolute;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#f6f6f4,#9c9f9f 72%);box-shadow:0 1px 2px #0007}
.screw:after{content:"";position:absolute;left:3px;right:3px;top:9px;height:2.4px;background:#55595c;transform:rotate(var(--r,28deg))}
.title{position:absolute;left:60px;top:40px;font-size:21px;font-stretch:90%;font-weight:600;color:#3b4552}
.warn{position:absolute;right:60px;top:40px;font-size:17px;font-stretch:84%;color:#55606c}
.bay{position:absolute;left:60px;right:60px;top:84px;height:330px;border-radius:3px;background:#2c3035;box-shadow:inset 0 3px 8px #000b;padding:6px;display:flex;gap:1px}
.m{position:relative;flex:1 1 0;height:100%;background:linear-gradient(180deg,#fbfbf8,#efefea);box-shadow:0 0 0 1px #0000002e;border-radius:2px}
.m.m2{flex:2 1 0}
.brow{position:absolute;left:0;right:0;top:0;height:50px;border-bottom:1px solid #00000022;background:#f5f5f1}
.foot{position:absolute;left:0;right:0;bottom:0;height:50px;border-top:1px solid #00000022;background:#f5f5f1}
.term{position:absolute;left:50%;top:13px;width:17px;height:17px;margin-left:-8.5px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#bfc2c1,#6e7272);box-shadow:inset 0 0 0 1.5px #0005}
.term:after{content:"";position:absolute;left:7px;top:3px;width:2.4px;height:11px;background:#2f3336;transform:rotate(38deg)}
.foot .term{top:18px}
.n{position:absolute;left:0;right:0;top:32px;text-align:center;font-size:13.5px;font-weight:650;color:#59636f}
.sw{position:absolute;left:50%;top:76px;width:29px;height:98px;margin-left:-14.5px;border-radius:3px;background:#1e2226;box-shadow:inset 0 2px 5px #000}
.sw i{position:absolute;left:2.5px;right:2.5px;top:3px;height:52px;border-radius:3px;background:linear-gradient(180deg,#616970,#39404a 45%,#272c33);box-shadow:0 2px 3px #000a,inset 0 1px 0 #fff4}
.sw b{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-size:12px;font-weight:700;color:#d0d4d6}
.rate{position:absolute;left:0;right:0;top:184px;text-align:center;font-size:17px;font-weight:700;letter-spacing:-.01em;color:#1d2530}
.kind{position:absolute;left:0;right:0;top:205px;text-align:center;font-size:11.5px;font-weight:550;font-stretch:80%;color:#5a6470}
.t{position:absolute;left:50%;top:228px;width:25px;height:19px;margin-left:-12.5px;border-radius:2px;background:linear-gradient(180deg,#3f7cc6,#2a5f9f);box-shadow:0 1px 2px #0007;color:#fff;font-size:12.5px;font-weight:700;text-align:center;line-height:19px}
.main .sw{left:50%;width:62px;height:112px;margin-left:-31px;top:70px}
.main .sw i{background:linear-gradient(180deg,#d9524a,#b4342c 50%,#962a24);height:60px}
.main .rate{top:192px}.main .kind{top:215px}
.lamp{position:absolute;left:50%;top:92px;width:30px;height:24px;margin-left:-15px;border-radius:3px;background:linear-gradient(#58c36a,#2f9a48);box-shadow:inset 0 1px 3px #0006,0 0 8px #58c36a66}
.spd .kind{top:130px;font-size:12.5px;font-stretch:84%}
.spd .rate{top:148px;font-size:15px}
.blank{background:linear-gradient(180deg,#f3f3ef,#e6e6e1)}
.strip{position:absolute;left:60px;right:60px;top:428px;height:150px;background:#fbfbf7;box-shadow:0 1px 3px #0003,inset 0 0 0 1px #0000000f;display:flex;padding:0 6px;border-radius:2px}
.cell{flex:1 1 0;position:relative;border-right:1px solid #1d253024;height:100%}
.cell.c2{flex:2 1 0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:650;color:#1d2530;font-stretch:88%}
.cell span{position:absolute;left:50%;bottom:10px;transform-origin:0 50%;transform:rotate(-90deg);white-space:nowrap;font-size:16px;font-weight:600;font-stretch:80%;color:#1d2530}
.cell.none span{color:#6a7480;font-weight:450}
.tails{position:absolute;left:300px;top:940px;display:flex;gap:9px}
.tails i{display:block;width:30px;height:470px;border-radius:0 0 2px 2px}
.b{background:linear-gradient(90deg,#3f2410,#8a5126 38%,#5c3518)}
.u{background:linear-gradient(90deg,#10294d,#2f6bb0 38%,#183a68)}
.e{background:repeating-linear-gradient(-34deg,#d8bc22 0 16px,#2f8340 16px 32px);box-shadow:inset 6px 0 6px #0007,inset -5px 0 7px #0007;width:22px!important;margin-top:0}
</style>
<body><div class="wall"></div>
<div class="tails"><i class="b"></i><i class="u"></i><i class="e"></i></div>
<div class="cu"><div class="lip"></div>
<div class="screw" style="left:30px;top:30px"></div><div class="screw" style="right:30px;top:30px;--r:-40deg"></div><div class="screw" style="left:30px;bottom:30px;--r:70deg"></div><div class="screw" style="right:30px;bottom:30px;--r:12deg"></div>
<p class="title">Consumer unit</p><p class="warn">Test RCBOs regularly. Press T: the device should trip.</p>
<div class="bay" id="bay"></div><div class="strip" id="strip"></div></div>
<script>
const ways=[["Lights U/S","B6"],["Lights D/S","B6"],["Alarms","B6"],["Ring U/S","B32"],["Ring D/S","B32"],["Kitchen","B32"],["Cooker","B32"],["Shower","B40"],["Boiler","B6"],["EV","B32"],["Garage","B16"],["Outside","B16"]];
const term='<div class="term"></div>';
let bay='<div class="m m2 main"><div class="brow">'+term+'</div><div class="sw"><i></i><b>I</b></div><div class="rate">100 A</div><div class="kind">Main switch</div><div class="foot">'+term+'</div></div>';
bay+='<div class="m m2 spd"><div class="brow">'+term+'</div><div class="lamp"></div><div class="kind">Surge protection</div><div class="rate">Type 2</div><div class="foot">'+term+'</div></div>';
ways.forEach(([n,r],i)=>{bay+=`<div class="m"><div class="brow">${term}<div class="n">${i+1}</div></div><div class="sw"><i></i><b>ON</b></div><div class="rate">${r}</div><div class="kind">30 mA</div><div class="t">T</div><div class="foot">${term}</div></div>`});
bay+='<div class="m blank"></div><div class="m blank"></div>';
document.getElementById('bay').innerHTML=bay;
let strip='<div class="cell c2">Main</div><div class="cell c2">Surge</div>';
ways.forEach(([n],i)=>{strip+=`<div class="cell"><span>${n}</span></div>`});
strip+='<div class="cell none"><span>Spare</span></div><div class="cell none" style="border:0"><span>Spare</span></div>';
document.getElementById('strip').innerHTML=strip;
</script>
